<div class="pager">
  {% if current_page == 1 %}
  <a href="{{ url_for('index', page=1, chapter=selected_chapter_id-1|default(0)) }}">← Previous Chapter</a>
  {% endif %}
  {% if current_page > 1 %}
  <a href="{{ url_for('index', page=current_page - 1, chapter=selected_chapter_id|default(0)) }}">← Previous page</a>
  {% endif %}
  <span>Page {{ current_page }} / {{ ((total_posts + per_page - 1) // per_page) or 1 }}</span>
  {% if current_page * per_page < total_posts %} <a
    href="{{ url_for('index', page=current_page + 1, chapter=selected_chapter_id|default(0)) }}">Next page →</a>
    {% else %}
    <a href="{{ url_for('index', page=1, chapter=selected_chapter_id+1|default(0)) }}">Next Chapter →</a>
    {% endif %}
</div>
