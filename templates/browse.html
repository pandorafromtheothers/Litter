{% extends 'base.html' %}

{% block content %}
<main class="feed">
    <div class="content-padding non-visible"></div>
    {% for book in books %}
        <a href="/?filename={{book}}">
                <div class="tweet-card browse">
                    <p class="tweet-body word-break">{{ book }}</p>
                </div>
        </a>
    {% endfor %}
</main>
{% endblock %}
